# Environnement de DÉVELOPPEMENT (la production aura son propre fichier au Sprint 3).
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  web:
    image: node:22-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /work
    env_file: .env
    environment: { HOME: /tmp }
    volumes: ["./web:/work"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "npm install --no-audit --no-fund && npm run db:migrate && npm run db:seed && npm run dev"
volumes:
  pgdata:
